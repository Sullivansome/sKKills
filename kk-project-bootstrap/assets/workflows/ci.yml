# CI template — adapt the "run" steps to the stack's command contract.
# The principle: CI runs the SAME commands the pre-commit hooks run, plus tests and build.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

