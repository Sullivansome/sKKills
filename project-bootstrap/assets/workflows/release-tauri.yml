# Tauri release: tag push v* -> draft GitHub Release with dmg / msi / AppImage.
# Requires: pnpm (or adapt install/build steps), src-tauri/tauri.conf.json.
# Optional secrets for signing: TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD), APPLE_* (see references/release.md).
# Adapt runtime/toolchain versions; resolve action refs to verified SHAs before production use.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # Apple Silicon -> dmg
            target: aarch64-apple-darwin
          - os: macos-15-intel  # Intel -> dmg
            target: x86_64-apple-darwin
          - os: windows-latest  # -> msi (+ nsis exe if configured)
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04    # -> AppImage + deb
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # rustup reads the exact tested version from rust-toolchain.toml.
      - run: rustup show active-toolchain
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseBody: "See the assets below."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
