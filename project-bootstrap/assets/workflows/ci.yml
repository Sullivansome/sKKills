# CI template — adapt the "run" steps to the stack's command contract.
# The principle: CI runs the SAME commands the pre-commit hooks run, plus tests and build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
